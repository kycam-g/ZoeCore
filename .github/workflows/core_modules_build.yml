name: nopch-module-build
on:
  push:
    branches:
      - 'master'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - 'src/**'
      - 'modules/**'
      - 'deps/**'
      - 'conf/dist/**'
      - 'CMakeLists.txt'
      - 'PreLoad.cmake'
      - 'apps/ci/**'
      - '.github/actions/linux-build/**'
      - '.github/workflows/core_modules_build.yml'

permissions:
  actions: write
  contents: read

concurrency:
  # One concurrency group per workflow + ref.
  #
  # - PRs use `refs/pull/<PR_NUMBER>/merge`, so new commits cancel older
  #   in-progress runs for the same PR.
  # - A merge does NOT cancel the PR's own runs: this group is keyed on
  #   refs/pull/<N>/merge and the master push on refs/heads/master, so they
  #   never share a group. See the cancel-pr-runs-on-close workflow.
  # - Branch pushes are isolated by ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-modules:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            compiler:
              CC: clang-18
              CXX: clang++-18
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}-${{ matrix.compiler.CC }}-nopch-modules
    if: >-
      contains(fromJSON('["azerothcore/azerothcore-wotlk", "kycam-g/ZoeCore"]'), github.repository)
      && !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v7
      # ZoeCore versions its modules in this repository; validate those exact sources.
      - name: Checkout upstream compatibility modules
        if: github.repository == 'azerothcore/azerothcore-wotlk'
        run: bash -x ./apps/ci/ci-install-modules.sh
      - uses: ./.github/actions/linux-build
        with:
          CC: ${{ matrix.compiler.CC }}
          CXX: ${{ matrix.compiler.CXX }}
          modules: true
          pch: false
          maxerrors: 0
          keepgoing: true
